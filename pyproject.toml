[project]
name = "wagoplc"
version = "0.1.1"
description = "Python library to interact with WAGO PLCs using Python."
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Andre Alexander Bell", email = "andre.bell@wago.com" },
    { name = "Maik Rehburg", email = "maik.rehburg@wago.com" },
    { name = "Johann Timm" },
    { name = "Kilian Romberg" }
]
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "pyyaml>=6.0.3",
    "schema>=0.7.8",
]

[project.urls]
Homepage = "https://github.com/wago-enterprise-education/python-wagoplc"
Documentation = "https://wago-enterprise-education.github.io/python-wagoplc/"
Repository = "https://github.com/wago-enterprise-education/python-wagoplc"
Issues = "https://github.com/wago-enterprise-education/python-wagoplc/issues"

[build-system]
requires = ["uv_build>=0.8.19,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyfakefs>=5.10.2",
    "ruff>=0.15.10",
    "unittest-xml-reporting>=3.2.0",
]
docs = [
    "lazydocs>=0.4.8",
]

[tool.ruff]
target-version = "py312"
exclude = [
"docs", "plc-application"
]
lint.per-file-ignores = {"test_tasks.py" = ["F841"], "wagoplc/__init__.py" = ["F401"]}

