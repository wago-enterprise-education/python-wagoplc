name: Run Tests

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches-ignore:
      - main
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/run-tests.yml"
  pull_request:
    branches:
      - main
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/run-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v2
        with:
          version: "latest"

      - name: Install dependencies
        run: |
          uv sync --python ${{ matrix.python-version }} --frozen --group dev

      - name: Run unit tests
        shell: bash
        run: |
          mkdir -p test-results
          uv run --python ${{ matrix.python-version }} python - <<'PY'
          import os
          import sys
          import unittest

          import xmlrunner

          suite = unittest.defaultTestLoader.discover("tests", pattern="test_*.py")
          output_path = os.path.join("test-results", f"junit-py{sys.version_info.major}{sys.version_info.minor}.xml")

          with open(output_path, "wb") as output_file:
              runner = xmlrunner.XMLTestRunner(output=output_file, verbosity=2)
              result = runner.run(suite)

          failures = len(result.failures)
          errors = len(result.errors)
          skipped = len(getattr(result, "skipped", []))
          expected_failures = len(getattr(result, "expectedFailures", []))
          unexpected_successes = len(getattr(result, "unexpectedSuccesses", []))
          success = result.wasSuccessful()

          summary_lines = [
              f"## Test Summary (Python {sys.version_info.major}.{sys.version_info.minor})",
              "",
              f"- Status: {'passed' if success else 'failed'}",
              f"- Tests run: {result.testsRun}",
              f"- Failures: {failures}",
              f"- Errors: {errors}",
              f"- Skipped: {skipped}",
              f"- Expected failures: {expected_failures}",
              f"- Unexpected successes: {unexpected_successes}",
              f"- JUnit XML: {output_path}",
          ]

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary_file:
              summary_file.write("\n".join(summary_lines) + "\n")

          sys.exit(0 if success else 1)
          PY

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-py${{ matrix.python-version }}
          path: test-results/*.xml
          retention-days: 30
