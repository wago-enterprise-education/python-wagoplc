# GitHub Action to start a new release branch from main.
# Follows the procedure described in development.md:
#   1. Bump project version in pyproject.toml with uv and selected pre-release type
#   2. Create and push a release/v<x.y.z> branch
#   3. Commit with message "start release branch"
#
# Restricted to maintainers via the "release" GitHub environment
# (configure deployment protection rules under Settings → Environments).

name: Start Release Branch

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Version bump type'
        required: true
        default: prerelease
        type: choice
        options:
          - prerelease
          - preminor
          - premajor

jobs:
  start-release-branch:
    runs-on: ubuntu-latest
    environment:
      name: release
      deployment: false

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v2
        with:
          version: "latest"

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump version in pyproject.toml
        id: bump
        shell: bash
        run: |
          case "${{ inputs.bump_type }}" in
            prerelease)
              uv_bump="patch"
              ;;
            preminor)
              uv_bump="minor"
              ;;
            premajor)
              uv_bump="major"
              ;;
            *)
              echo "Unsupported bump_type: ${{ inputs.bump_type }}"
              exit 1
              ;;
          esac

          base_version="$(uv version --bump "$uv_bump" --dry-run --output-format json | python -c 'import json, sys; print(json.load(sys.stdin)["version"])')"
          new_version="${base_version}.dev0"
          branch_name="release/v${base_version}"

          uv version "$new_version" --frozen
          actual_version="$(uv version --short)"

          {
            echo "new_version=$actual_version"
            echo "base_version=$base_version"
            echo "branch_name=$branch_name"
          } >> "$GITHUB_OUTPUT"

          echo "New version: $actual_version"
          echo "Release branch: $branch_name"

      - name: Derive release branch name
        run: |
          echo "Bumped to ${{ steps.bump.outputs.new_version }}"
          echo "Branch: ${{ steps.bump.outputs.branch_name }}"

      - name: Validate release branch name
        shell: bash
        run: |
          BRANCH="${{ steps.bump.outputs.branch_name }}"
          if [[ -z "$BRANCH" ]]; then
            echo "Error: branch_name output is empty"
            exit 1
          fi

          if [[ ! "$BRANCH" =~ ^release/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Error: invalid branch format: $BRANCH"
            exit 1
          fi

      - name: Ensure release branch does not already exist on origin
        shell: bash
        run: |
          BRANCH="${{ steps.bump.outputs.branch_name }}"
          if git ls-remote --exit-code --heads origin "$BRANCH" > /dev/null; then
            echo "Error: remote branch already exists: $BRANCH"
            exit 1
          fi

      - name: Create release branch
        shell: bash
        run: git switch -c "${{ steps.bump.outputs.branch_name }}"

      - name: Commit version bump
        run: |
          git add pyproject.toml
          git commit -m "start release branch"

      - name: Push release branch
        shell: bash
        run: git push -u origin "${{ steps.bump.outputs.branch_name }}"
